version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: insurance_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: insurance_claims
    volumes:
      - mongo_data:/data/db
    networks:
      - claim_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: insurance_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/insurance_claims
      JWT_SECRET: super_secure_insurance_jwt_secret_key_2026
      CLIENT_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - claim_network

  frontend:
    build:
      context: ./client
      dockerfile: ../Dockerfile.frontend
    container_name: insurance_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - claim_network

networks:
  claim_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
